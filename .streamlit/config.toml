
[server]
maxUploadSize = 5

[theme]
base = "light"
# Ledger Navy. Native options are preferred over CSS overrides (Streamlit 1.66).
primaryColor = "#1E3A8A"
backgroundColor = "#F6F7F9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#101828"
linkColor = "#1E3A8A"
borderColor = "#E4E7EC"
dataframeBorderColor = "#E4E7EC"
dataframeHeaderBackgroundColor = "#F9FAFB"
dataframeHeaderTextColor = "#475467"
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
# h1..h6. Keeps page titles business-sized instead of Streamlit's 2.75rem default.
headingFontSizes = ["1.75rem", "1.375rem", "1.125rem", "1rem", "0.9375rem", "0.875rem"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
metricValueFontSize = "1.75rem"
codeFont = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
codeTextColor = "#101828"
codeBackgroundColor = "#F2F4F7"
showWidgetBorder = true
# Semantic colours used by st.info / st.success / st.warning / st.error.
blueTextColor = "#1E3A8A"
blueBackgroundColor = "#EEF2FF"
greenTextColor = "#067647"
greenBackgroundColor = "#ECFDF3"
yellowTextColor = "#93600A"
yellowBackgroundColor = "#FFFAEB"
redTextColor = "#B42318"
redBackgroundColor = "#FEF3F2"

[client]
toolbarMode = "viewer"
